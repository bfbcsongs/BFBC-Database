<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BFBC SONGS DATABASE by paulm</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col relative">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex flex-row justify-between items-center gap-2">
            <a href="#" class="flex items-center space-x-2">
                <i class="fa-solid fa-music text-indigo-400 text-2xl"></i>
                <div class="flex flex-col">
                    <h1 class="text-xl font-bold tracking-wide text-white hidden sm:block">BFBC SONGS DATABASE</h1>
                    <h1 class="text-xl font-bold tracking-wide text-white sm:hidden">BFBC SONGS</h1>
                    <span class="text-[10px] text-indigo-400 font-medium tracking-wider uppercase -mt-1">by paulm</span>
                </div>
            </a>
            <div class="flex items-center gap-3">
                <span class="text-xs text-indigo-300 font-medium px-2.5 py-1 bg-slate-700/60 rounded-full border border-slate-600 hidden sm:inline-block">
                    by paulm
                </span>
                <button id="add-song-btn" class="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-2 px-3 rounded-lg shadow transition-all cursor-pointer">
                    <i class="fa-solid fa-plus"></i> Add Song
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full">
        
        <!-- Search Section -->
        <div class="relative mb-6">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <input 
                type="text" 
                id="search-input"
                placeholder="Search songs by title, lyrics, or category..." 
                class="w-full pl-10 pr-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all shadow-inner"
            >
        </div>

        <!-- Categories Filter Buttons -->
        <div class="mb-6">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Categories</h2>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2" id="category-buttons">
                <button data-category="Opening" class="category-btn bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white border border-slate-700 font-medium py-2 px-3 rounded-lg text-sm transition-all text-center cursor-pointer">
                    Opening
                </button>
                <button data-category="Joyful" class="category-btn bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white border border-slate-700 font-medium py-2 px-3 rounded-lg text-sm transition-all text-center cursor-pointer">
                    Joyful
                </button>
                <button data-category="Solemn" class="category-btn bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white border border-slate-700 font-medium py-2 px-3 rounded-lg text-sm transition-all text-center cursor-pointer">
                    Solemn
                </button>
                <button data-category="Offering" class="category-btn bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white border border-slate-700 font-medium py-2 px-3 rounded-lg text-sm transition-all text-center cursor-pointer">
                    Offering
                </button>
                <button data-category="Closing" class="category-btn bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white border border-slate-700 font-medium py-2 px-3 rounded-lg text-sm transition-all text-center cursor-pointer">
                    Closing
                </button>
                <button data-category="Others" class="category-btn bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white border border-slate-700 font-medium py-2 px-3 rounded-lg text-sm transition-all text-center cursor-pointer">
                    Others
                </button>
            </div>
        </div>

        <!-- Songs List Container -->
        <section id="songs-container" class="space-y-4 hidden">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h2 id="list-header" class="text-sm font-semibold text-slate-400">Song Results</h2>
                <span id="song-count" class="text-xs text-indigo-400 font-medium"></span>
            </div>

            <div id="songs-list" class="space-y-3">
                <!-- Songs render here -->
            </div>
        </section>

    </main>

    <!-- Modal for Add/Edit Song -->
    <div id="song-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative space-y-4">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 id="modal-title" class="text-lg font-bold text-white">Add New Song</h3>
                <button id="close-modal-btn" class="text-slate-400 hover:text-white text-lg cursor-pointer">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="song-form" class="space-y-4">
                <input type="hidden" id="song-id">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Song Title</label>
                    <input type="text" id="song-title-input" required placeholder="e.g. Amazing Grace" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Category</label>
                    <select id="song-category-input" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                        <option value="Opening">Opening</option>
                        <option value="Joyful">Joyful</option>
                        <option value="Solemn">Solemn</option>
                        <option value="Offering">Offering</option>
                        <option value="Closing">Closing</option>
                        <option value="Others">Others</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Audio Link (URL)</label>
                    <input type="url" id="song-audio-input" placeholder="https://..." class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Video Link (URL)</label>
                    <input type="url" id="song-video-input" placeholder="https://..." class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Lyrics</label>
                    <textarea id="song-lyrics-input" rows="4" placeholder="Enter lyrics here..." class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"></textarea>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t border-slate-700">
                    <button type="button" id="cancel-modal-btn" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold rounded-lg transition-all cursor-pointer">Cancel</button>
                    <button type="submit" id="save-btn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg transition-all flex items-center gap-2 cursor-pointer">
                        <span>Save Song</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Link to JavaScript Logic File -->
    <script src="app.js"></script>
</body>
</html>
