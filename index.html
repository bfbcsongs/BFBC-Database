<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BFBC SONGS DATABASE by paulm</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex flex-row justify-between items-center gap-2">
            <a href="#" class="flex items-center space-x-2">
                <i class="fa-solid fa-music text-indigo-400 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide text-white hidden sm:block">BFBC SONGS DATABASE</h1>
                <h1 class="text-xl font-bold tracking-wide text-white sm:hidden">BFBC SONGS</h1>
            </a>
            <div class="flex items-center gap-3">
                <span class="text-xs text-indigo-300 font-medium px-2.5 py-1 bg-slate-700/60 rounded-full border border-slate-600 hidden sm:inline-block">
                    by paulm
                </span>
                <button id="add-song-btn" class="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-2 px-3 rounded-lg shadow transition-all">
                    <i class="fa-solid fa-plus"></i> Add Song
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full">
        
        <!-- Search Section -->
        <div class="relative mb-6">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <input 
                type="text" 
                id="search-input"
                placeholder="Search songs by title, lyrics, or category..." 
                class="w-full pl-10 pr-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all shadow-inner cursor-pointer"
            >
        </div>

        <!-- Categories Filter Buttons -->
        <div class="mb-6">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Categories</h2>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2" id="category-buttons">
                <button data-category="Opening" class="category-btn bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white border border-slate-700 font-medium py-2 px-3 rounded-lg text-sm transition-all text-center">
                    Opening
                </button>
                <button data-category="Joyful" class="category-btn bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white border border-slate-700 font-medium py-2 px-3 rounded-lg text-sm transition-all text-center">
                    Joyful
                </button>
                <button data-category="Solemn" class="category-btn bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white border border-slate-700 font-medium py-2 px-3 rounded-lg text-sm transition-all text-center">
                    Solemn
                </button>
                <button data-category="Offering" class="category-btn bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white border border-slate-700 font-medium py-2 px-3 rounded-lg text-sm transition-all text-center">
                    Offering
                </button>
                <button data-category="Closing" class="category-btn bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white border border-slate-700 font-medium py-2 px-3 rounded-lg text-sm transition-all text-center">
                    Closing
                </button>
                <button data-category="Others" class="category-btn bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white border border-slate-700 font-medium py-2 px-3 rounded-lg text-sm transition-all text-center">
                    Others
                </button>
            </div>
        </div>

        <!-- Songs List Container (Hidden by default) -->
        <section id="songs-container" class="space-y-4 hidden">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h2 id="list-header" class="text-sm font-semibold text-slate-400">Song Results</h2>
                <span id="song-count" class="text-xs text-indigo-400 font-medium"></span>
            </div>

            <div id="songs-list" class="space-y-3">
                <!-- Dynamic song items loaded from Supabase -->
            </div>
        </section>

    </main>

    <!-- Modal for Add/Edit Song -->
    <div id="song-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative space-y-4">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 id="modal-title" class="text-lg font-bold text-white">Add New Song</h3>
                <button id="close-modal-btn" class="text-slate-400 hover:text-white text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="song-form" class="space-y-4">
                <input type="hidden" id="song-id">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Song Title</label>
                    <input type="text" id="song-title-input" required placeholder="e.g. Amazing Grace" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Category</label>
                    <select id="song-category-input" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                        <option value="Opening">Opening</option>
                        <option value="Joyful">Joyful</option>
                        <option value="Solemn">Solemn</option>
                        <option value="Offering">Offering</option>
                        <option value="Closing">Closing</option>
                        <option value="Others">Others</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Audio Link (URL)</label>
                    <input type="url" id="song-audio-input" placeholder="https://..." class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Video Link (URL)</label>
                    <input type="url" id="song-video-input" placeholder="https://..." class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Lyrics</label>
                    <textarea id="song-lyrics-input" rows="4" placeholder="Enter lyrics here..." class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"></textarea>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t border-slate-700">
                    <button type="button" id="cancel-modal-btn" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold rounded-lg transition-all">Cancel</button>
                    <button type="submit" id="save-btn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg transition-all flex items-center gap-2">
                        <span>Save Song</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- App Logic Script -->
    <script>
        // -------------------------------------------------------------
        // 1. SUPABASE INITIALIZATION
        // REPLACE THESE TWO VALUES WITH YOUR SUPABASE PROJECT CREDENTIALS
        // -------------------------------------------------------------
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let songs = []; // Local cache fetched from Supabase
        let activeCategory = null;

        const searchInput = document.getElementById('search-input');
        const categoryButtons = document.querySelectorAll('.category-btn');
        const songsContainer = document.getElementById('songs-container');
        const songsList = document.getElementById('songs-list');
        const songCount = document.getElementById('song-count');
        const listHeader = document.getElementById('list-header');

        const songModal = document.getElementById('song-modal');
        const modalTitle = document.getElementById('modal-title');
        const songForm = document.getElementById('song-form');
        const addSongBtn = document.getElementById('add-song-btn');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const cancelModalBtn = document.getElementById('cancel-modal-btn');

        // Fetch Songs from Supabase Table 'songs'
        async function fetchSongs() {
            try {
                const { data, error } = await db
                    .from('songs')
                    .select('*')
                    .order('title', { ascending: true });

                if (error) throw error;
                songs = data || [];
            } catch (err) {
                console.error('Error fetching songs from Supabase:', err);
            }
        }

        // Render song cards
        function renderSongs(songsToRender, titleText) {
            listHeader.textContent = titleText;
            
            const sortedSongs = [...songsToRender].sort((a, b) => a.title.localeCompare(b.title));
            songCount.textContent = `${sortedSongs.length} song${sortedSongs.length === 1 ? '' : 's'} found`;

            if (sortedSongs.length === 0) {
                songsList.innerHTML = `<p class="text-center text-slate-500 py-8">No songs found.</p>`;
                return;
            }

            songsList.innerHTML = sortedSongs.map(song => `
                <div class="p-4 bg-slate-800 border border-slate-700/70 rounded-xl hover:border-indigo-500/50 transition-all flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div class="space-y-1">
                        <div class="flex items-center gap-2 flex-wrap">
                            <h3 class="font-bold text-lg text-white">${song.title}</h3>
                            <span class="text-xs px-2.5 py-0.5 bg-indigo-950/80 text-indigo-300 border border-indigo-800/50 rounded-full font-medium">
                                ${song.category}
                            </span>
                        </div>
                        <p class="text-sm text-slate-300 italic line-clamp-2">"${song.lyrics || 'No lyrics provided'}"</p>
                    </div>

                    <div class="flex items-center gap-2 shrink-0">
                        ${song.audio_url ? `
                        <a href="${song.audio_url}" target="_blank" class="flex items-center gap-1.5 px-3 py-1.5 bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600 hover:text-white border border-emerald-600/30 rounded-lg text-xs font-semibold transition-all">
                            <i class="fa-solid fa-music"></i> Audio
                        </a>` : ''}
                        ${song.video_url ? `
                        <a href="${song.video_url}" target="_blank" class="flex items-center gap-1.5 px-3 py-1.5 bg-rose-600/20 text-rose-400 hover:bg-rose-600 hover:text-white border border-rose-600/30 rounded-lg text-xs font-semibold transition-all">
                            <i class="fa-solid fa-play"></i> Video
                        </a>` : ''}
                        <button onclick="editSong('${song.id}')" class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-700 text-slate-300 hover:bg-slate-600 hover:text-white border border-slate-600 rounded-lg text-xs font-semibold transition-all">
                            <i class="fa-solid fa-pen"></i> Edit
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function openAndFilterSongs() {
            songsContainer.classList.remove('hidden');
            await fetchSongs(); // Sync latest data

            const query = searchInput.value.toLowerCase().trim();
            
            let filtered = songs.filter(song => {
                const matchesSearch = song.title.toLowerCase().includes(query) || (song.lyrics && song.lyrics.toLowerCase().includes(query));
                const matchesCategory = activeCategory ? song.category === activeCategory : true;
                return matchesSearch && matchesCategory;
            });

            const headerLabel = activeCategory 
                ? (query ? `${activeCategory} Songs matching "${query}"` : `${activeCategory} Songs`)
                : (query ? `Results for "${query}"` : "All Songs");

            renderSongs(filtered, headerLabel);
        }

        function clearCategorySelection() {
            activeCategory = null;
            categoryButtons.forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white');
                btn.classList.add('bg-slate-800', 'text-slate-300');
            });
        }

        function handleSearchFocus() {
            clearCategorySelection();
            openAndFilterSongs();
        }

        searchInput.addEventListener('click', handleSearchFocus);
        searchInput.addEventListener('focus', handleSearchFocus);
        searchInput.addEventListener('input', openAndFilterSongs);

        categoryButtons.forEach(button => {
            button.addEventListener('click', () => {
                const category = button.getAttribute('data-category');

                if (activeCategory === category) {
                    clearCategorySelection();
                } else {
                    clearCategorySelection();
                    activeCategory = category;
                    button.classList.remove('bg-slate-800', 'text-slate-300');
                    button.classList.add('bg-indigo-600', 'text-white');
                }

                openAndFilterSongs();
            });
        });

        function openModal(isEdit = false) {
            modalTitle.textContent = isEdit ? "Edit Song" : "Add New Song";
            songModal.classList.remove('hidden');
        }

        function closeModal() {
            songModal.classList.add('hidden');
            songForm.reset();
            document.getElementById('song-id').value = '';
        }

        addSongBtn.addEventListener('click', () => openModal(false));
        closeModalBtn.addEventListener('click', closeModal);
        cancelModalBtn.addEventListener('click', closeModal);

        window.editSong = function(id) {
            const song = songs.find(s => s.id == id);
            if (!song) return;

            document.getElementById('song-id').value = song.id;
            document.getElementById('song-title-input').value = song.title;
            document.getElementById('song-category-input').value = song.category;
            document.getElementById('song-audio-input').value = song.audio_url || '';
            document.getElementById('song-video-input').value = song.video_url || '';
            document.getElementById('song-lyrics-input').value = song.lyrics || '';

            openModal(true);
        };

        // Save/Insert into Supabase
        songForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('song-id').value;
            const songPayload = {
                title: document.getElementById('song-title-input').value,
                category: document.getElementById('song-category-input').value,
                audio_url: document.getElementById('song-audio-input').value || null,
                video_url: document.getElementById('song-video-input').value || null,
                lyrics: document.getElementById('song-lyrics-input').value || null
            };

            try {
                if (id) {
                    // Update existing song
                    const { error } = await db
                        .from('songs')
                        .update(songPayload)
                        .eq('id', id);

                    if (error) throw error;
                } else {
                    // Insert new song
                    const { error } = await db
                        .from('songs')
                        .insert([songPayload]);

                    if (error) throw error;
                }

                closeModal();
                openAndFilterSongs();
            } catch (err) {
                alert('Error saving song: ' + err.message);
            }
        });

        // Initial background fetch
        fetchSongs();
    </script>
</body>
                            </html>
